<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}CM Web{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 0; background: #f7f8fa; color: #222;
    }
    header {
      background: #1e293b; color: #fff; padding: 14px 24px;
      display: flex; align-items: center; gap: 20px;
    }
    header a { color: #cbd5e1; text-decoration: none; }
    header a:hover { color: #fff; }
    header .brand { font-weight: 600; font-size: 18px; color: #fff; }
    main { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td {
      border: 1px solid #e2e8f0; padding: 6px 10px; text-align: left;
      font-size: 13px; vertical-align: top;
    }
    th { background: #f1f5f9; position: sticky; top: 0; }
    tr:nth-child(even) td { background: #fafbfc; }
    code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; }
    .muted { color: #64748b; }
    .error {
      background: #fee2e2; border: 1px solid #fecaca; color: #991b1b;
      padding: 12px 16px; border-radius: 6px; margin: 12px 0;
    }
    textarea {
      width: 100%; min-height: 120px; font-family: ui-monospace, monospace;
      font-size: 13px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;
    }
    button {
      background: #2563eb; color: #fff; border: none;
      padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <header>
    <span class="brand">CM Web</span>
  <a href="{{ url_for('index') }}">Объекты</a>
  <a href="{{ url_for('archive') }}">Архив</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
